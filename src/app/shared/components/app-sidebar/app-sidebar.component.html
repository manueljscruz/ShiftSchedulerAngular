<div id="side-bar" class="primary-color-bg">
    <div class="logo">
        <span class="logo-text">Shift<span class="logo-accent">Scheduler</span></span>
    </div>
    <mat-divider></mat-divider>
    <div class="menu">
        <div id="menu-top-options">
            <sidebar-item [sidebarItemText]="'Dashboard'" [sidebarItemRouterLink]="DASHBOARD_HOME_ROUTE" [sidebarItemIcon]="DASHBOARD_HOME_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
            <sidebar-item [sidebarItemText]="'Profile'" [sidebarItemRouterLink]="PROFILE_ROUTE" [sidebarItemIcon]="PROFILE_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
            <sidebar-item [sidebarItemText]="'New Entity'" [sidebarItemRouterLink]="NEW_ENTITY_ROUTE" [sidebarItemIcon]="ENTITY_ADD_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
            <sidebar-item [sidebarItemText]="'My Invitations'" [sidebarItemRouterLink]="MY_INVITATIONS_ROUTE" [sidebarItemIcon]="INVITATIONS_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
            <sidebar-item [sidebarItemText]="'Notifications'" [sidebarItemRouterLink]="NOTIFICATIONS_ROUTE" [sidebarItemIcon]="NOTIFICATIONS_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
        </div>

        <mat-divider></mat-divider>

        <div id="menu-entities-container">
            <sidebar-item-group *ngFor="let item of workEntitiesSideBarItems" [sidebarItemGroupId]="item.sidebarItemId" [sidebarItemGroupText]="item.sidebarItemText" [sidebarGroupItems]="item.sidebarItemChildren" [sidebarItemGroupIcon]="ENTITY_ICON" (navigationEvent)="onNavigationClick()"></sidebar-item-group>
        </div>

        <mat-divider></mat-divider>

        <div id="menu-bottom-options">
            <sidebar-item [sidebarItemText]="'Settings'" [sidebarItemRouterLink]="SETTINGS_ROUTE" [sidebarItemIcon]="SETTINGS_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
            <sidebar-item [sidebarItemText]="'Help'" [sidebarItemRouterLink]="HELP_ROUTE" [sidebarItemIcon]="HELP_ICON" (eventTriggered)="onNavigationClick()"></sidebar-item>
            <sidebar-item [sidebarItemText]="'Logout'" (eventTriggered)="onLogoutClick()" [sidebarItemRouterLink]="LANDING_PAGE_ROUTE" [sidebarItemIcon]="LOGOUT_ICON"></sidebar-item>
        </div>
    </div>
</div>
