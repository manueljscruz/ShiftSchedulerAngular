<div id="message-dialog">
    <h1 i18n>{{messageTitle}}</h1>
    <p i18n>{{messageText}}</p>
    <div class="actions">
        <button mat-fab extended class="secondary-color-bg" [mat-dialog-close]="false">
            <mat-icon>close</mat-icon>
            <span i18n>Ok</span>
        </button>
    </div>
</div>
