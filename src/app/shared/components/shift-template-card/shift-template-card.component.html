<div matRipple class="shift-template-grid-card" (click)="onSelectShiftTemplate()">
    <div class="card-header">
        <h3>{{templateName}}</h3>
    </div>
    <div class="row">
    <p>{{templateAlias}}</p>
</div>
    <span i18n><b>Start Time</b></span>
    <p>{{ formattedStartTime }}</p>
    
    <span i18n><b>Break Duration</b></span>
    <p>{{ formattedDuration }}</p>
</div>
