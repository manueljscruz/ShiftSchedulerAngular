<div id="login-view">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <h3>Login</h3>
                <form (ngSubmit)="login()" #loginForm="ngForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <!--
                        <input type="text" class="form-control" id="username" name="username" required [(ngModel)]="username" #username="ngModel">
                        -->
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <!--
                        <input type="password" class="form-control" id="password" name="password" required [(ngModel)]="password" #password="ngModel">
                        -->
                    </div>
                    <button type="submit" class="btn btn-primary" [disabled]="!loginForm.form.valid">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
