<div id="login-view">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <mat-card id="login-card">
                    <div class="row" id="login-logo">
                        <img src="https://placehold.co/100x80" alt="Logo">
                    </div>
                    <div class="row">
                        <form id="login-form">
                            <mat-form-field>
                                <input matInput placeholder="Email" type="email" [(ngModel)]="email" name="email" required>
                            </mat-form-field>
                            <mat-form-field>
                                <input matInput placeholder="Password" type="password" [(ngModel)]="password" name="password" required>
                            </mat-form-field>
                            <div class="row">
                                <button mat-raised-button color="primary" (click)="login()">Login</button>
                            </div>
                        </form>
                    </div>
                </mat-card>
            </div>
        </div>
    </div>
</div>
