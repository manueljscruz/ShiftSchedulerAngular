<div id="admin-subscriptions">
    <div class="admin-subscriptions-header">
        <h1>Subscriptions</h1>
        <p>Manage application subscription plans and user billing.</p>
    </div>

    <div class="admin-subscriptions-grid">
        <mat-card class="admin-sub-card placeholder">
            <div class="sub-card-icon">
                <mat-icon>star</mat-icon>
            </div>
            <span class="sub-label">Active Plans</span>
            <span class="sub-value coming-soon">Coming soon</span>
        </mat-card>

        <mat-card class="admin-sub-card placeholder">
            <div class="sub-card-icon">
                <mat-icon>people</mat-icon>
            </div>
            <span class="sub-label">Subscribers</span>
            <span class="sub-value coming-soon">Coming soon</span>
        </mat-card>

        <mat-card class="admin-sub-card placeholder">
            <div class="sub-card-icon">
                <mat-icon>payments</mat-icon>
            </div>
            <span class="sub-label">Revenue</span>
            <span class="sub-value coming-soon">Coming soon</span>
        </mat-card>

        <mat-card class="admin-sub-card placeholder">
            <div class="sub-card-icon">
                <mat-icon>cancel</mat-icon>
            </div>
            <span class="sub-label">Cancellations</span>
            <span class="sub-value coming-soon">Coming soon</span>
        </mat-card>
    </div>

    <mat-card class="admin-sub-table-placeholder">
        <div class="placeholder-inner">
            <mat-icon>table_chart</mat-icon>
            <span>Subscription table coming soon</span>
        </div>
    </mat-card>
</div>
