<h2 mat-dialog-title>{{ isEdit ? 'Edit' : 'New' }} Subscription Plan Type</h2>

<mat-dialog-content>
    <form [formGroup]="form">

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" placeholder="e.g. Pro" />
            <mat-error *ngIf="form.get('name')?.hasError('required')">Required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <input matInput formControlName="description" />
        </mat-form-field>

        <div *ngIf="data.languages.length > 0" class="section">
            <p class="section-title">Localizations</p>
            <div formArrayName="localizations">
                <div *ngFor="let locCtrl of localizationsArray.controls; let i = index"
                     [formGroupName]="i"
                     class="localization-row">
                    <span class="lang-code">{{ locCtrl.get('localizationCode')?.value }}</span>
                    <mat-form-field appearance="outline" class="loc-field">
                        <mat-label>Localized name</mat-label>
                        <input matInput formControlName="nameDisplayValue" />
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="loc-field">
                        <mat-label>Localized description</mat-label>
                        <input matInput formControlName="descriptionDisplayValue" />
                    </mat-form-field>
                </div>
            </div>
        </div>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid">
        {{ isEdit ? 'Save' : 'Create' }}
    </button>
</mat-dialog-actions>
