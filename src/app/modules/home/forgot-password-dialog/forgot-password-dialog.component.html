<div>
    <h1 mat-dialog-title i18n>Forgot Password</h1>
    <form id="forgot-password-form">
        <mat-dialog-content>
            <p class="dialog-description" i18n>
                Enter your email address and we'll send you a link to reset your password.
            </p>

            <mat-form-field appearance="outline" class="w-100">
                <mat-label i18n>Email</mat-label>
                <input matInput
                       type="email"
                       [(ngModel)]="emailInput"
                       name="emailInput"
                       id="emailInput"
                       required
                       [disabled]="isLoading">
                <mat-icon matPrefix>email</mat-icon>
            </mat-form-field>

            <div class="success-message" *ngIf="emailSent">
                <mat-icon>check_circle</mat-icon>
                <p i18n>
                    If an account exists with this email, you will receive a password reset link shortly.
                    Please check your inbox and spam folder.
                </p>
            </div>
        </mat-dialog-content>

        <mat-dialog-actions align="end">
            <button mat-button
                    (click)="onCancel()"
                    [disabled]="isLoading"
                    i18n>
                Cancel
            </button>
            <button mat-raised-button
                    class="secondary-color-bg"
                    (click)="onSubmit()"
                    [disabled]="!emailInput || isLoading || emailSent">
                <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
                <span *ngIf="!isLoading && !emailSent" i18n>Send Reset Link</span>
                <span *ngIf="emailSent" i18n>Email Sent</span>
            </button>
        </mat-dialog-actions>
    </form>
</div>
