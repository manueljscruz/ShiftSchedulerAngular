<loading-screen></loading-screen>
<div id="dashboard-container">
    <!-- Desktop sidebar - fixed position, always visible on desktop -->
    <div id="desktop-sidebar" class="show-desktop-only" [class.expanded]="isSidebarExpanded">
        <app-sidebar [workEntitiesSideBarItems]="workEntitiesSideBarItems" (logoutEvent)="logout()"></app-sidebar>
    </div>

    <!-- Mobile drawer - only rendered on mobile -->
    <mat-sidenav-container id="mobile-sidenav-container" class="hide-desktop">
        <mat-sidenav #drawer mode="over" [(opened)]="sidebarOpen" class="mobile-sidenav">
            <app-sidebar [workEntitiesSideBarItems]="workEntitiesSideBarItems" (logoutEvent)="logout()" (navigationEvent)="closeSidebar()"></app-sidebar>
        </mat-sidenav>
        <mat-sidenav-content>
            <div id="dashboard-view">
                <app-header [showMenuButton]="true" (menuButtonClicked)="toggleSidebar()"></app-header>
                <mat-divider></mat-divider>
                <div id="dashboard-content">
                    <router-outlet *ngIf="isMobile"></router-outlet>
                </div>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>

    <!-- Desktop content area - only rendered on desktop -->
    <div id="dashboard-view" class="show-desktop-only">
        <app-header [showMenuButton]="false"></app-header>
        <mat-divider></mat-divider>
        <div id="dashboard-content">
            <router-outlet *ngIf="!isMobile"></router-outlet>
        </div>
    </div>
</div>
