<h2 mat-dialog-title>{{ isEdit ? 'Edit' : 'New' }} Subscription Duration Type</h2>

<mat-dialog-content>
    <form [formGroup]="form">

        <div class="row-2">
            <mat-form-field appearance="outline" class="flex-grow">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="e.g. Monthly" />
                <mat-error *ngIf="form.get('name')?.hasError('required')">Required</mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" style="width: 110px">
                <mat-label>Days</mat-label>
                <input matInput type="number" formControlName="durationInDays" />
            </mat-form-field>
        </div>

        <div class="toggles-row">
            <mat-slide-toggle formControlName="appliesPromo" color="primary">Applies promotional discount</mat-slide-toggle>
        </div>

        <mat-form-field appearance="outline" class="full-width" *ngIf="form.get('appliesPromo')?.value">
            <mat-label>Promo Percentage</mat-label>
            <input matInput type="number" formControlName="promoPercentage" />
            <span matSuffix>%</span>
        </mat-form-field>

        <div *ngIf="data.languages.length > 0" class="section">
            <p class="section-title">Localizations</p>
            <div formArrayName="localizations">
                <div *ngFor="let locCtrl of localizationsArray.controls; let i = index"
                     [formGroupName]="i"
                     class="localization-row">
                    <span class="lang-code">{{ locCtrl.get('localizationCode')?.value }}</span>
                    <mat-form-field appearance="outline" class="loc-field">
                        <mat-label>Display name</mat-label>
                        <input matInput formControlName="displayValue" />
                    </mat-form-field>
                </div>
            </div>
        </div>

    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid">
        {{ isEdit ? 'Save' : 'Create' }}
    </button>
</mat-dialog-actions>
