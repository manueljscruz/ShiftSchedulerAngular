<div class="elevated-card-container primary-card-container-height">
    <div class="header-and-actions">
        <h1 i18n>
            Schedule
            <button mat-mini-fab class="mobile-menu-toggle" (click)="isMobileActionsOpen = !isMobileActionsOpen">
                <mat-icon>{{ isMobileActionsOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
            </button>
        </h1>
        <div class="actions" [class.open]="isMobileActionsOpen">
            <mat-button-toggle-group (change)="onViewChange($event)">
                <mat-button-toggle value="calendar">Calendar</mat-button-toggle>
                <mat-button-toggle checked="true" value="list">List</mat-button-toggle>
            </mat-button-toggle-group>

            <!-- Start Date -->
            <mat-form-field appearance="outline" class="date-field">
                <mat-label i18n>Start Date</mat-label>
                <input matInput [matDatepicker]="startDatePicker" [value]="startDate" (dateChange)="onStartDateChange($event)"> <!-- (change)="onStartDateChange($event)" -->
                <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #startDatePicker></mat-datepicker>
            </mat-form-field>

            <!-- End Date -->

            <mat-form-field appearance="outline" class="date-field">
                <mat-label i18n>End Date</mat-label>
                <input matInput [matDatepicker]="endDatePicker" [value]="endDate" (dateChange)="onEndDateChange($event)">
                <mat-datepicker-toggle matIconSuffix [for]="endDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #endDatePicker></mat-datepicker>
            </mat-form-field>

            <button mat-fab extended color="primary" (click)="exportScheduleToExcel()">
                <mat-icon>import_export</mat-icon>
                <span i18n>Export</span>
            </button>

            <button mat-fab extended color="primary" (click)="onApplySearch()">
                <mat-icon>search</mat-icon>
                <span i18n>Search</span>
            </button>
            <button *ngIf="isCurrentUserEntityOwner" mat-fab extended class="delete-color-bg" (click)="onDeleteSchedule()">
                <mat-icon>delete</mat-icon>
                <span i18n>Delete Schedule</span>
            </button>
            <button *ngIf="isCurrentUserEntityOwner" mat-fab extended color="primary" (click)="onCreateSchedule()">
                <mat-icon>build</mat-icon>
                <span i18n>Create Schedule</span>
            </button>
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="elevated-card-container-content">
        <div>
            <!-- *ngSwitchCase="CalendarView.Month" -->
            <mwl-calendar-month-view *ngIf="isCalendarView"
                [viewDate]="viewDate"
                [events]="events"
                (eventClicked)="showEvent($event)"
                (dayClicked)="dayClicked($event)"
            >
            </mwl-calendar-month-view>

            
            <div id="schedule-list" *ngIf="isListView">
                <table mat-table [dataSource]="scheduleList" class="mat-elevation-z8">
                
                    <ng-container *ngFor="let column of calendarListColumns" [matColumnDef]="column">
                        <th mat-header-cell *matHeaderCellDef> {{ column  }} </th>
                        <td mat-cell *matCellDef="let element" [ngStyle]="getCellStyle(column, element[column])" > <!-- (click)="onScheduleListCellClick(element, column)" -->
                            
                            <!-- If its a manager/owner that is using this view -->
                            <ng-container *ngIf="isCurrentUserEntityOwner">

                                <!-- If the column is not the employee column, allow for actions -->
                                <ng-container *ngIf="column != EMPLOYEE_COLUMN">
                                    <div [matMenuTriggerFor]="menu">
                                        <span>
                                            {{ element[column]?.alias || element[column] }}
                                        </span>
                                    </div>
                                </ng-container>

                                <!-- If the column is the employee column, show just text -->
                                <ng-container *ngIf="column === EMPLOYEE_COLUMN">
                                    <span>
                                        {{ element[column]?.alias || element[column] }}
                                    </span>
                                </ng-container>
                                
                                <!-- Action Menu for the schedule entry-->
                                <mat-menu #menu="matMenu">
                                    <button mat-menu-item (click)="onOpenEntry(element, column)"> <!-- .id -->
                                        <mat-icon>{{SCHEDULE_ICON}}</mat-icon>
                                        <span>View Day Schedule</span>
                                    </button>
                                    <button mat-menu-item (click)="onManageDaySchedule(element.id, column)">
                                        <mat-icon>{{MAT_EDIT_ICON}}</mat-icon>
                                        <span>Manage Day Schedule</span>
                                    </button>
                                    <mat-divider></mat-divider>
                                    <button mat-menu-item [matMenuTriggerFor]="shiftMenu">
                                        <mat-icon>{{SCHEDULE_ICON}}</mat-icon>
                                        <span>Assign Shift</span>
                                    </button>
                                    <ng-container *ngIf="element.isPartOfRotation">
                                        <button mat-menu-item (click)="onStartRotationCycle(element.id, column)" [disabled]="isCycleTracking">
                                            <mat-icon>{{MAT_EDIT_ICON}}</mat-icon>
                                            <span>Start Rotation Cycle</span>
                                        </button>
                                        <button mat-menu-item (click)="onCancelCycleOp()" [disabled]="!isCycleTracking">
                                            <mat-icon>{{CANCEL_ICON}}</mat-icon>
                                            <span>Cancel Rotation</span>
                                        </button>
                                        <button mat-menu-item (click)="onEndRotationCycle(element.id, column)" [disabled]="!isCycleTracking">
                                            <mat-icon>{{DONE_ICON}}</mat-icon>
                                            <span>End Rotation Cycle</span>
                                        </button>
                                    </ng-container> 
                                    <button mat-menu-item (click)="onClearDailyEmployeeAssignments(element.id, column)">
                                        <mat-icon>{{CLOSE_ICON}}</mat-icon>
                                        <span>Clear Daily Assignments</span>
                                    </button>
                                    <button mat-menu-item (click)="onClearEmployeeAssignments(element.id, column)">
                                        <mat-icon>{{CLOSE_ICON}}</mat-icon>
                                        <span>Clear All Employee Assignments</span>
                                    </button>
                                </mat-menu>

                                <mat-menu #shiftMenu="matMenu">
                                    <ng-container *ngFor="let option of scheduleViewModel.shifts">
                                        <button mat-menu-item (click)="assignShiftToEmployee(element.id, column, option.shiftId)">
                                            <mat-icon>{{ SCHEDULE_ICON }}</mat-icon>
                                            <span>{{ option.shiftName }}</span>
                                        </button>
                                    </ng-container>
                                </mat-menu>
                            </ng-container>

                            <!-- If its a regular user that is using this view -->
                            <ng-container *ngIf="!isCurrentUserEntityOwner">
                                <ng-container *ngIf="loggedUser?.userId === element.id">
                                    <div [matMenuTriggerFor]="userMenu">
                                        <span>
                                            {{ element[column]?.alias || element[column] }}
                                        </span>
                                    </div>
                                </ng-container>
                                <ng-container *ngIf="loggedUser?.userId !== element.id">
                                    <span>
                                        {{ element[column]?.alias || element[column] }}
                                    </span>
                                </ng-container>

                                <!-- Action Menu for the schedule entry-->
                                <mat-menu #userMenu="matMenu">
                                    <button mat-menu-item (click)="onOpenEntry(element.id, column)">
                                        <mat-icon>{{SCHEDULE_ICON}}</mat-icon>
                                        <span>View Entry</span>
                                    </button>
                                </mat-menu>

                            </ng-container>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="calendarListColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: calendarListColumns;"></tr>
                </table>

            </div>
            
        </div>
    </div>
</div>
