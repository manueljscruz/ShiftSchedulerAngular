<div class="elevated-card-container primary-card-container-height">
    <div class="header-and-actions">
        <h1 i18n>Schedule</h1>
        <div class="actions">
            <input type="date" matInput required placeholder="Start Date" required name="schedule-start-date" [value]="formatDateString(startDate.toString())">
            <input type="date" matInput required placeholder="End Date" required name="schedule-end-date" [value]="formatDateString(endDate.toString())">
            <button *ngIf="isCurrentUserEntityOwner" mat-fab extended color="primary" (click)="createSchedule()">
                <mat-icon>build</mat-icon>
                <span i18n>Create Schedule</span>
            </button>
        </div>
    </div>
    <mat-divider></mat-divider>
    <div class="elevated-card-container-content">
        <div>
            <!-- *ngSwitchCase="CalendarView.Month" -->
            <mwl-calendar-month-view
                [viewDate]="viewDate"
                [events]="events"
                (eventClicked)="handleEventClicked($event)"
            >
            </mwl-calendar-month-view>
        </div>
    </div>
</div>
