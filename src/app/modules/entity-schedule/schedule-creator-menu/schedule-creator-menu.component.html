<div id="schedule-creator-menu">
    <mat-dialog-content>
        <h1 i18n>Schedule Creator</h1>
        <mat-checkbox [checked]="singleRoleResponsibility" name="singleRoleCheckbox">
            <span i18n>Single Role Responsibility</span>
        </mat-checkbox>
        <mat-checkbox [checked]="clearExistingSchedule" name="singleRoleCheckbox">
            <span i18n>Clear Existing Schedule</span>
        </mat-checkbox>

        <mat-tab-group [selectedIndex]="selectedTabIndex" >
        <!-- Options -->
            <mat-tab label="Members">
                <div>
                    <table mat-table [dataSource]="entityWorkerMembers" class="mat-elevation-z1">

                        <!-- Checkbox Column -->
                        <ng-container matColumnDef="select">
                            <th mat-header-cell *matHeaderCellDef>
                                <mat-checkbox (change)="$event ? masterToggle() : null"
                                                            [checked]="isAllSelected()"
                                                            [indeterminate]="isSomeSelected()">
                                </mat-checkbox>
                            </th>
                            <td mat-cell *matCellDef="let member">
                                <mat-checkbox (click)="$event.stopPropagation()"
                                    (change)="toggleSelection(member)"
                                    [checked]="member.isSelected(member)">
                                </mat-checkbox>
                            </td>
                        </ng-container>

                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef i18n>Name</th>
                            <td mat-cell *matCellDef="let member">{{ member.workerName }}</td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="['select', 'name']"></tr>
                        <tr mat-row *matRowDef="let row; columns: ['select', 'name'];"></tr>
                    </table>
                </div>
            </mat-tab>
            <mat-tab label="Shifts">
                <div>
                    <span i18n>Shifts</span>
                </div>
            </mat-tab>
            <mat-tab label="Rules">
                <div>
                    <span i18n>Rules</span>
                </div>
            </mat-tab>
        </mat-tab-group>

    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button (click)="onClose()">Close</button>
        <button mat-button (click)="onCreate()">Create</button>
    </mat-dialog-actions>
</div>
