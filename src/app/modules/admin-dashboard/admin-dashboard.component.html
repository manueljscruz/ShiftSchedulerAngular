<div id="admin-dashboard-container">

    <!-- Desktop sidebar -->
    <div id="admin-desktop-sidebar" class="show-desktop-only">
        <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
    </div>

    <!-- Mobile drawer -->
    <mat-sidenav-container id="admin-mobile-sidenav-container" class="hide-desktop">
        <mat-sidenav #drawer mode="over" [(opened)]="sidebarOpen" class="admin-mobile-sidenav">
            <ng-container *ngTemplateOutlet="sidebarContent; context: { mobile: true }"></ng-container>
        </mat-sidenav>
        <mat-sidenav-content>
            <div id="admin-dashboard-view">
                <ng-container *ngTemplateOutlet="headerContent; context: { showMenu: true }"></ng-container>
                <mat-divider></mat-divider>
                <div id="admin-dashboard-content">
                    <router-outlet *ngIf="isMobile"></router-outlet>
                </div>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>

    <!-- Desktop content -->
    <div id="admin-dashboard-view" class="show-desktop-only">
        <ng-container *ngTemplateOutlet="headerContent; context: { showMenu: false }"></ng-container>
        <mat-divider></mat-divider>
        <div id="admin-dashboard-content">
            <router-outlet *ngIf="!isMobile"></router-outlet>
        </div>
    </div>
</div>

<!-- Sidebar template -->
<ng-template #sidebarContent let-mobile="mobile">
    <div class="admin-sidebar">
        <div class="admin-sidebar-header">
            <span class="sidebar-logo-text">Shift<span class="sidebar-logo-accent">Scheduler</span></span>
            <span class="sidebar-admin-badge">Back Office</span>
        </div>
        <nav class="admin-sidebar-nav">
            <a class="admin-nav-item"
               routerLink="/admin/dashboard/home"
               routerLinkActive="active"
               (click)="mobile && closeSidebar()">
                <mat-icon>dashboard</mat-icon>
                <span>Dashboard</span>
            </a>
            <a class="admin-nav-item"
               routerLink="/admin/dashboard/subscriptions"
               routerLinkActive="active"
               (click)="mobile && closeSidebar()">
                <mat-icon>star</mat-icon>
                <span>Subscriptions</span>
            </a>
            <a class="admin-nav-item"
               routerLink="/admin/dashboard/configuration"
               routerLinkActive="active"
               (click)="mobile && closeSidebar()">
                <mat-icon>tune</mat-icon>
                <span>Configuration</span>
            </a>
        </nav>
        <div class="admin-sidebar-footer">
            <button class="admin-logout-btn" (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Log out</span>
            </button>
        </div>
    </div>
</ng-template>

<!-- Header template -->
<ng-template #headerContent let-showMenu="showMenu">
    <div class="admin-header">
        <div class="admin-header-left">
            <button *ngIf="showMenu" mat-icon-button (click)="toggleSidebar()" class="menu-toggle">
                <mat-icon>menu</mat-icon>
            </button>
            <span class="admin-header-title">Admin Panel</span>
        </div>
        <div class="admin-header-right">
            <span class="admin-header-user">{{ loggedUser?.userDisplayName }}</span>
            <mat-icon class="admin-user-icon">admin_panel_settings</mat-icon>
        </div>
    </div>
</ng-template>
