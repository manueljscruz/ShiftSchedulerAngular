
    <div class="elevated-card-container primary-card-container-height fade-in">
        <div class="header-and-actions">
            <h1 i18n>
            Members
            <button mat-mini-fab class="mobile-menu-toggle" (click)="isMobileActionsOpen = !isMobileActionsOpen">
                <mat-icon>{{ isMobileActionsOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
            </button>
        </h1>
            <div class="actions" *ngIf="isCurrentUserEntityOwner" [class.open]="isMobileActionsOpen">

                <mat-button-toggle-group (change)="onViewChange($event)">
                    <mat-button-toggle value="grid">Grid</mat-button-toggle>
                    <mat-button-toggle checked="true" value="list">List</mat-button-toggle>
                </mat-button-toggle-group>

                <button mat-fab extended class="secondary-color-bg" (click)="toggleFilters()">
                    <mat-icon>filter_list</mat-icon>
                    <span>Filters</span>
                </button>

                <button mat-fab extended class="edit-color-bg"(click)="openAddMemberDialog(UI_DIALOG_ENTRANCE_DURATION, UI_DIALOG_EXIT_DURATION, entityMembersViewModel.skills)">
                    <mat-icon>add</mat-icon>
                    <span i18n>Add Member</span>
                </button>
            </div>
        </div>
        <mat-divider></mat-divider>
        <div class="elevated-card-container-content">

            <!-- Entity Worker List -->
            <div id="entity-worker-list-container">
                <ng-container *ngIf="isGridView">
                    <div id="entity-worker-grid">
                        <div class="entity-worker-list-item" *ngFor="let member of entityMembersViewModel.entityMembers.data">
                            <entity-worker-member-card [entityWorkerMember]="member" [allowActions]="isCurrentUserEntityOwner" (editWorkerTemplateEvent)="onEditMember($event)" (deleteWorkerTemplateEvent)="onDeleteMember($event)"></entity-worker-member-card>
                        </div>
                    </div>
                </ng-container>

                <ng-container *ngIf="isListView">
                    <table mat-table [dataSource]="entityMembersViewModel.entityMembers.data" class="mat-elevation-z1 full-width-table" matSort>

                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <th mat-header-cell *matHeaderCellDef i18n>Name</th>
                            <td mat-cell *matCellDef="let member">{{ member.workerName }}</td>
                        </ng-container>

                        <!-- Skill Column -->
                        <ng-container matColumnDef="skill">
                            <th mat-header-cell *matHeaderCellDef i18n>Skill</th>
                            <td mat-cell *matCellDef="let member">
                                <span *ngFor="let skill of member.skillSet; let last = last">
                                    {{ skill.skillLocalizedName }}<span *ngIf="!last">, </span>
                                </span>
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="rotation" mat-sort-header>
                            <th mat-header-cell *matHeaderCellDef i18n>In Rotation</th>
                            <td mat-cell *matCellDef="let member">
                                {{ member.partOfRotation ? 'Yes' : 'No' }}
                            </td>
                        </ng-container>

                        <ng-container matColumnDef="multipleShift" mat-sort-header>
                            <th mat-header-cell *matHeaderCellDef i18n>Multiple Shift</th>
                            <td mat-cell *matCellDef="let member">
                                {{ member.multipleShiftAssignments ? 'Yes' : 'No' }}
                            </td>
                        </ng-container>

                        <!-- Actions Column (if owner) -->
                        <ng-container *ngIf="isCurrentUserEntityOwner" matColumnDef="actions">
                            <th mat-header-cell *matHeaderCellDef i18n>Actions</th>
                            <td mat-cell *matCellDef="let member">
                                <button *ngIf="member.isBot" mat-icon-button (click)="onConvertBotToUser(member)">
                                    <mat-icon>compare_arrows</mat-icon>
                                </button>

                                <button mat-icon-button color="primary" (click)="onEditMember(member)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" (click)="onRemoveMemberFromList(member)" [matTooltip]="member.isBot ? 'Delete' : 'Kick Out'">
                                    <mat-icon>{{ member.isBot ? 'delete' : 'person_remove' }}</mat-icon>
                                </button>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="isCurrentUserEntityOwner ? ['name', 'skill', 'rotation', 'multipleShift', 'actions'] : ['name', 'skill', 'rotation', 'multipleShift']"></tr>
                        <tr mat-row *matRowDef="let row; columns: isCurrentUserEntityOwner ? ['name', 'skill', 'rotation', 'multipleShift', 'actions'] : ['name', 'skill', 'rotation', 'multipleShift']"></tr>
                    </table>
                </ng-container>
                <mat-paginator
                        class="paginator" 
                        #paginator
                        (page)="handlePageEvent($event)"
                        [length]="entityMembersViewModel.entityMembers.totalCount"
                        [pageSize]="pageSize"
                        [showFirstLastButtons]=true
                        [pageSizeOptions]="pageSizeOptions"
                        [pageIndex]="entityMembersViewModel.entityMembers.currentPage-1"
                        aria-label="Select page">
                    </mat-paginator>
            </div>
        </div>
    </div>
