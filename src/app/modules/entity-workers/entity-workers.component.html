<div class="container">
    <div class="elevated-card-container">
        <h1 i18n>Members</h1>
        <div class="div-spacer"></div>
        <div class="elevated-card-container-content">
            <div id="entity-worker-filters-container">
                <button class="action-filter-button">
                    <i class="{{BOOTSTRAP_ICON_PREFIX}}{{FILTER_ICON}}"></i>
                    <span i18n>Filter</span>
                </button>
                <mat-form-field appearance="outline">
                    <mat-select [(ngModel)]="selectedSkill">
                        <mat-option *ngFor="let skill of entityMembersViewModel.skills" [value]="skill">{{skill.skillLocalizedName}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div id="entity-worker-list-container">
                <div class="entity-worker-list-item" *ngFor="let member of entityMembersViewModel.entityMembers">
                    <entity-worker-member-card [entityWorkerMember]="member"></entity-worker-member-card>
                </div>
            </div>
        </div>
    </div>
</div>
