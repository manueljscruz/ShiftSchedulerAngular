<div id="exit-entity-dialog">
    <h1 i18n>Leave Entity</h1>

    <mat-radio-group [(ngModel)]="exitMode" name="exit-mode" style="display: flex; flex-direction: column; gap: 8px;">
        <mat-radio-button value="immediate" i18n>Exit immediately</mat-radio-button>
        <mat-radio-button value="scheduled" i18n>Schedule exit date</mat-radio-button>
        <mat-radio-button *ngIf="hasScheduledExit" value="cancel" i18n>Cancel scheduled exit</mat-radio-button>
    </mat-radio-group>

    <div *ngIf="exitMode === 'scheduled'" style="margin-top: 16px;">
        <mat-form-field appearance="outline">
            <mat-label i18n>Exit Date</mat-label>
            <input matInput [matDatepicker]="exitPicker" [(ngModel)]="scheduledDate" [min]="tomorrow" name="exit-date">
            <mat-datepicker-toggle matSuffix [for]="exitPicker"></mat-datepicker-toggle>
            <mat-datepicker #exitPicker></mat-datepicker>
        </mat-form-field>
    </div>

    <p *ngIf="exitMode === 'cancel'" style="margin-top: 12px; color: var(--mat-sys-on-surface-variant);" i18n>
        Your scheduled exit will be removed and you will remain an active member.
    </p>

    <div class="actions" style="display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end;">
        <button mat-fab extended class="secondary-color-bg" [mat-dialog-close]="false">
            <mat-icon>close</mat-icon>
            <span i18n>Cancel</span>
        </button>
        <button mat-fab extended class="warn-color-bg" (click)="confirm()" [disabled]="!canConfirm || isLoading">
            <mat-icon>{{ exitMode === 'cancel' ? 'undo' : 'exit_to_app' }}</mat-icon>
            <span i18n>{{ exitMode === 'cancel' ? 'Cancel Exit' : 'Confirm' }}</span>
        </button>
    </div>
</div>
