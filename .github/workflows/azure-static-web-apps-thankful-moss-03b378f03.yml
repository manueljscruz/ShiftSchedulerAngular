name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - stage

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build -- --configuration=staging
        
      - name: Copy static web app config
        run: cp staticwebapp.config.json dist/shift-scheduler-angular/browser/
        
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_MOSS_03B378F03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist/shift-scheduler-angular/browser"  # ← CHANGED: No /en since localize: false
          skip_app_build: true
          output_location: ""